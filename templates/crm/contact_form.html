{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto mt-8">
    <div class="glass rounded-2xl border border-slate-700 shadow-2xl p-8">
        <div class="mb-4">
            <a href="{% url 'client_detail' client.id %}" class="text-gray-500 hover:text-white text-sm transition flex items-center gap-2">
                <span>←</span> Retour à {{ client.name }}
            </a>
        </div>
        <h2 class="text-2xl font-bold text-white mb-6 border-b border-slate-700 pb-4 flex items-center gap-3">
            <span>👤</span> {{ titre }}
        </h2>
        <form method="post" class="django-form-container">
            {% csrf_token %}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                {% for field in form %}
                <div class="{% if field.name in 'notes' %}md:col-span-2{% else %}md:col-span-1{% endif %}">
                    <label class="block text-gray-400 text-xs font-bold mb-1 uppercase tracking-wider">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}<p class="text-red-400 text-[10px] mt-1">{{ field.errors }}</p>{% endif %}
                </div>
                {% endfor %}
            </div>
            <div class="flex justify-end gap-3 mt-8 pt-6 border-t border-slate-700">
                <a href="{% url 'client_detail' client.id %}" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-2.5 px-6 rounded-lg transition">Annuler</a>
                <button type="submit" class="bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-2.5 px-8 rounded-lg shadow-lg shadow-yellow-500/20 transition uppercase tracking-wider text-sm">
                    💾 Enregistrer
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
