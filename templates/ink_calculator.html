{% extends 'base.html' %}{% block content %}<div class="max-w-7xl mx-auto p-5 text-white"><h1 class="text-3xl font-black">🧪 Calculateur de consommation d’encre</h1><p class="text-gray-400 mb-6">Calcul technique par couverture, volume Anilox, transfert, densité et perte propre au job.</p><form method="post" class="space-y-5">{% csrf_token %}<section class="grid md:grid-cols-4 gap-3 bg-slate-800 p-5 rounded-2xl border border-slate-700"><input required name="name" placeholder="Nom du job" class="bg-slate-950 p-3 rounded"><select name="process" class="bg-slate-950 p-3 rounded"><option value="FLEXO">Flexographie</option><option value="HELIO">Héliogravure</option></select><input required type="number" step=".01" name="width_mm" placeholder="Laize imprimée mm" class="bg-slate-950 p-3 rounded"><input required type="number" step=".01" name="length_m" placeholder="Métrage m" class="bg-slate-950 p-3 rounded"><input type="number" step=".01" name="repeat_mm" placeholder="Pas de coupe mm" class="bg-slate-950 p-3 rounded"><input name="transfer_percent" required type="number" step=".01" min=".01" max="100" placeholder="Transfert Anilox %" class="bg-slate-950 p-3 rounded"><input name="loss_percent" required type="number" step=".01" min="0" max="100" placeholder="Perte du job %" class="bg-slate-950 p-3 rounded"><input name="poses_across" type="number" min="1" value="1" placeholder="Poses laize" class="bg-slate-950 p-3 rounded"></section><section class="bg-slate-800 p-5 rounded-2xl"><div class="flex justify-between"><h2 class="font-black">Séparation des couleurs</h2><button type="button" onclick="addColor()" class="bg-cyan-600 px-3 py-2 rounded">+ Couleur</button></div><div id="colors" class="space-y-2 mt-4"></div></section><button class="bg-orange-500 text-slate-950 font-black px-7 py-3 rounded-xl">Calculer et enregistrer</button></form></div><template id="row"><div class="grid md:grid-cols-7 gap-2 border border-slate-700 p-3 rounded-xl"><input name="color_name" required placeholder="Couleur" class="bg-slate-950 p-2 rounded"><select name="ink_type" class="bg-slate-950 p-2 rounded"><option value="COLOR">Couleur</option><option value="WHITE">Blanc TiO₂</option><option value="VARNISH">Vernis</option></select><input name="coverage" required type="number" step=".001" min="0" max="100" placeholder="Couverture %" class="bg-slate-950 p-2 rounded"><input name="area_cm2" type="number" step=".001" placeholder="Surface cm²" class="bg-slate-950 p-2 rounded"><select name="anilox" required class="bg-slate-950 p-2 rounded">{% for a in aniloxes %}<option value="{{ a.id }}">{{ a.lineature }} — {{ a.volume_cm3_m2 }} cm³/m²</option>{% endfor %}</select><input name="density" type="number" step=".001" placeholder="Densité (auto si vide)" class="bg-slate-950 p-2 rounded"><input name="price" type="number" step=".01" placeholder="Prix/kg" class="bg-slate-950 p-2 rounded"></div></template><script>function addColor(){document.getElementById('colors').append(document.getElementById('row').content.cloneNode(true))}addColor();</script>{% endblock %}
