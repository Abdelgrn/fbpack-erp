{% extends 'base.html' %}
{% block content %}
<div class="mb-6 flex items-center gap-4">
    <a href="{% url 'piece_detail' piece.id %}" class="text-gray-400 hover:text-white">← Retour</a>
    <h1 class="text-2xl font-bold text-white">{{ titre }}</h1>
</div>
<form method="post" class="max-w-xl bg-slate-800 border border-slate-700 rounded-xl p-6">
    {% csrf_token %}
    <div class="bg-slate-700/50 rounded-lg p-4 mb-6 flex justify-between items-center">
        <div><div class="text-white font-bold">{{ piece.designation }}</div><div class="text-gray-400 text-xs">{{ piece.reference }}</div></div>
        <div class="text-center"><div class="text-2xl font-bold {% if piece.est_rupture %}text-red-400{% elif piece.est_stock_bas %}text-yellow-400{% else %}text-emerald-400{% endif %}">{{ piece.quantite_stock }} {{ piece.unite }}</div><div class="text-gray-500 text-xs">Stock actuel</div></div>
    </div>
    <div class="space-y-4">
        <div><label class="text-gray-400 text-xs uppercase font-bold">Type de mouvement *</label>
        <select name="type_mouvement" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none" required>
            {% for value, label in form.fields.type_mouvement.choices %}<option value="{{ value }}" {% if form.type_mouvement.value == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
        </select></div>
        <div><label class="text-gray-400 text-xs uppercase font-bold">Quantité *</label>
        <input type="number" step="0.01" name="quantite" value="{{ form.quantite.value|default:'1' }}" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none" required></div>
        <div><label class="text-gray-400 text-xs uppercase font-bold">Motif</label>
        <input type="text" name="motif" value="{{ form.motif.value|default:'' }}" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none"></div>
        <div><label class="text-gray-400 text-xs uppercase font-bold">Notes</label>
        <textarea name="notes" rows="2" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none">{{ form.notes.value|default:'' }}</textarea></div>
    </div>
    <div class="flex gap-3 mt-6">
        <button type="submit" class="bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-3 px-8 rounded-lg transition">💾 Enregistrer</button>
        <a href="{% url 'piece_detail' piece.id %}" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-8 rounded-lg transition">Annuler</a>
    </div>
</form>
{% endblock %}
