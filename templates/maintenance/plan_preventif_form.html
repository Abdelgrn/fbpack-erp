{% extends 'base.html' %}
{% block content %}
<div class="mb-6 flex items-center gap-4">
    <a href="{% url 'plan_preventif_list' %}" class="text-gray-400 hover:text-white">← Retour</a>
    <h1 class="text-2xl font-bold text-white">{{ titre }}</h1>
</div>
<form method="post" class="max-w-3xl">
    {% csrf_token %}
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6">
            <h2 class="text-white font-bold mb-4">📋 Identification</h2>
            <div class="space-y-4">
                <div>
                    <label class="text-gray-400 text-xs uppercase font-bold">Machine *</label>
                    <select name="machine" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none" required>
                        <option value="">-- Sélectionner --</option>
                        {% for m in form.fields.machine.queryset %}
                        <option value="{{ m.id }}" {% if form.machine.value|stringformat:"s" == m.id|stringformat:"s" %}selected{% endif %}>{{ m.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="text-gray-400 text-xs uppercase font-bold">Titre *</label>
                    <input type="text" name="titre" value="{{ form.titre.value|default:'' }}" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none" required>
                </div>
                <div>
                    <label class="text-gray-400 text-xs uppercase font-bold">Description</label>
                    <textarea name="description" rows="3" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none">{{ form.description.value|default:'' }}</textarea>
                </div>
                <div>
                    <label class="text-gray-400 text-xs uppercase font-bold">Technicien par défaut</label>
                    <select name="technicien_defaut" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none">
                        <option value="">-- Aucun --</option>
                        {% for emp in form.fields.technicien_defaut.queryset %}
                        <option value="{{ emp.id }}" {% if form.technicien_defaut.value|stringformat:"s" == emp.id|stringformat:"s" %}selected{% endif %}>{{ emp.nom_complet }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6">
            <h2 class="text-white font-bold mb-4">⏱ Fréquence</h2>
            <div class="space-y-4">
                <div>
                    <label class="text-gray-400 text-xs uppercase font-bold">Type de fréquence *</label>
                    <select name="type_frequence" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none">
                        {% for value, label in form.fields.type_frequence.choices %}
                        <option value="{{ value }}" {% if form.type_frequence.value == value %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="text-gray-400 text-xs uppercase font-bold">Fréquence (jours)</label>
                    <input type="number" name="frequence_jours" value="{{ form.frequence_jours.value|default:'30' }}" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none">
                </div>
                <div>
                    <label class="text-gray-400 text-xs uppercase font-bold">Fréquence (heures machine)</label>
                    <input type="number" name="frequence_heures" value="{{ form.frequence_heures.value|default:'0' }}" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none">
                </div>
                <div>
                    <label class="text-gray-400 text-xs uppercase font-bold">Durée estimée (min)</label>
                    <input type="number" name="duree_estimee_minutes" value="{{ form.duree_estimee_minutes.value|default:'60' }}" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none">
                </div>
                <div>
                    <label class="text-gray-400 text-xs uppercase font-bold">Priorité</label>
                    <select name="priorite" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none">
                        <option value="NORMALE">Normale</option>
                        <option value="HAUTE">Haute</option>
                        <option value="URGENTE">Urgente</option>
                        <option value="BASSE">Basse</option>
                    </select>
                </div>
                <div>
                    <label class="text-gray-400 text-xs uppercase font-bold">Statut</label>
                    <select name="statut" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none">
                        <option value="ACTIF">Actif</option>
                        <option value="INACTIF">Inactif</option>
                        <option value="SUSPENDU">Suspendu</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
    <div class="flex gap-3 mt-6">
        <button type="submit" class="bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-3 px-8 rounded-lg transition">💾 Enregistrer</button>
        <a href="{% url 'plan_preventif_list' %}" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-8 rounded-lg transition">Annuler</a>
    </div>
</form>
{% endblock %}
