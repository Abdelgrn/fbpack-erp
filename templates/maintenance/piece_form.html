{% extends 'base.html' %}
{% block content %}
<div class="mb-6 flex items-center gap-4">
    <a href="{% url 'piece_list' %}" class="text-gray-400 hover:text-white">← Retour</a>
    <h1 class="text-2xl font-bold text-white">{{ titre }}</h1>
</div>
<form method="post" enctype="multipart/form-data" class="max-w-3xl">
    {% csrf_token %}
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6">
            <h2 class="text-white font-bold mb-4">📋 Identification</h2>
            <div class="space-y-4">
                <div><label class="text-gray-400 text-xs uppercase font-bold">Référence *</label>
                <input type="text" name="reference" value="{{ form.reference.value|default:'' }}" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none" required></div>
                <div><label class="text-gray-400 text-xs uppercase font-bold">Désignation *</label>
                <input type="text" name="designation" value="{{ form.designation.value|default:'' }}" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none" required></div>
                <div><label class="text-gray-400 text-xs uppercase font-bold">Catégorie</label>
                <select name="categorie" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none">
                    <option value="">-- Aucune --</option>
                    {% for cat in form.fields.categorie.queryset %}<option value="{{ cat.id }}" {% if form.categorie.value|stringformat:"s" == cat.id|stringformat:"s" %}selected{% endif %}>{{ cat }}</option>{% endfor %}
                </select></div>
                <div><label class="text-gray-400 text-xs uppercase font-bold">Marque</label>
                <input type="text" name="marque_piece" value="{{ form.marque_piece.value|default:'' }}" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none"></div>
                <div><label class="text-gray-400 text-xs uppercase font-bold">Réf. fournisseur</label>
                <input type="text" name="reference_fournisseur" value="{{ form.reference_fournisseur.value|default:'' }}" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none"></div>
                <div><label class="text-gray-400 text-xs uppercase font-bold">Emplacement</label>
                <input type="text" name="emplacement_stock" value="{{ form.emplacement_stock.value|default:'' }}" placeholder="Ex: Étagère A3, Casier 12" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none"></div>
            </div>
        </div>
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6">
            <h2 class="text-white font-bold mb-4">📦 Stock & Prix</h2>
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="text-gray-400 text-xs uppercase font-bold">Qté en stock</label>
                    <input type="number" step="0.01" name="quantite_stock" value="{{ form.quantite_stock.value|default:'0' }}" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none"></div>
                    <div><label class="text-gray-400 text-xs uppercase font-bold">Unité</label>
                    <select name="unite" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none">
                        {% for value, label in form.fields.unite.choices %}<option value="{{ value }}" {% if form.unite.value == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
                    </select></div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="text-gray-400 text-xs uppercase font-bold">Stock minimum</label>
                    <input type="number" step="0.01" name="stock_minimum" value="{{ form.stock_minimum.value|default:'1' }}" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none"></div>
                    <div><label class="text-gray-400 text-xs uppercase font-bold">Stock maximum</label>
                    <input type="number" step="0.01" name="stock_maximum" value="{{ form.stock_maximum.value|default:'50' }}" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none"></div>
                </div>
                <div><label class="text-gray-400 text-xs uppercase font-bold">Prix unitaire (DA)</label>
                <input type="number" step="0.01" name="prix_unitaire" value="{{ form.prix_unitaire.value|default:'0' }}" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none"></div>
                <div><label class="text-gray-400 text-xs uppercase font-bold">Fournisseur</label>
                <select name="fournisseur" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none">
                    <option value="">-- Aucun --</option>
                    {% for f in form.fields.fournisseur.queryset %}<option value="{{ f.id }}" {% if form.fournisseur.value|stringformat:"s" == f.id|stringformat:"s" %}selected{% endif %}>{{ f }}</option>{% endfor %}
                </select></div>
                <div><label class="text-gray-400 text-xs uppercase font-bold">Délai livraison (jours)</label>
                <input type="number" name="delai_livraison_jours" value="{{ form.delai_livraison_jours.value|default:'7' }}" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none"></div>
            </div>
        </div>
    </div>
    <div class="flex gap-3 mt-6">
        <button type="submit" class="bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-3 px-8 rounded-lg transition">💾 Enregistrer</button>
        <a href="{% url 'piece_list' %}" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-8 rounded-lg transition">Annuler</a>
    </div>
</form>
{% endblock %}
