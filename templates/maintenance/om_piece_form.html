{% extends 'base.html' %}
{% block content %}
<div class="mb-6 flex items-center gap-4">
    <a href="{% url 'om_detail' om.id %}" class="text-gray-400 hover:text-white">← Retour OM-{{ om.numero_om }}</a>
    <h1 class="text-2xl font-bold text-white">{{ titre }}</h1>
</div>
<form method="post" class="max-w-xl bg-slate-800 border border-slate-700 rounded-xl p-6">
    {% csrf_token %}
    <div class="space-y-4">
        <div>
            <label class="text-gray-400 text-xs uppercase font-bold">Pièce *</label>
            <select name="piece" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none" required>
                <option value="">-- Sélectionner --</option>
                {% for p in form.fields.piece.queryset %}
                <option value="{{ p.id }}">{{ p.designation }} ({{ p.reference }}) — Stock: {{ p.quantite_stock }} {{ p.unite }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="text-gray-400 text-xs uppercase font-bold">Quantité *</label>
            <input type="number" step="0.01" name="quantite" value="{{ form.quantite.value|default:'1' }}" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none" required>
        </div>
        <div>
            <label class="text-gray-400 text-xs uppercase font-bold">Notes</label>
            <textarea name="notes" rows="2" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none"></textarea>
        </div>
    </div>
    <div class="flex gap-3 mt-6">
        <button type="submit" class="bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-3 px-8 rounded-lg transition">💾 Ajouter</button>
        <a href="{% url 'om_detail' om.id %}" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-8 rounded-lg transition">Annuler</a>
    </div>
</form>
{% endblock %}
