{% extends 'base.html' %}
{% block content %}
<div class="mb-6 flex items-center gap-4">
    <a href="{% url 'maintenance_machine_detail' machine.id %}" class="text-gray-400 hover:text-white">← Retour</a>
    <h1 class="text-2xl font-bold text-white">{{ titre }}</h1>
</div>
<form method="post" class="max-w-xl bg-slate-800 border border-slate-700 rounded-xl p-6">
    {% csrf_token %}
    <div class="space-y-4">
        <div class="bg-slate-700/50 rounded-lg p-4 grid grid-cols-3 gap-4 text-center mb-2">
            <div><div class="text-cyan-400 font-bold text-lg">{{ machine.compteur_heures|floatformat:1 }}h</div><div class="text-gray-500 text-xs">Heures</div></div>
            <div><div class="text-blue-400 font-bold text-lg">{{ machine.compteur_metres|floatformat:0 }}m</div><div class="text-gray-500 text-xs">Mètres</div></div>
            <div><div class="text-purple-400 font-bold text-lg">{{ machine.compteur_tours|floatformat:0 }}</div><div class="text-gray-500 text-xs">Tours</div></div>
        </div>
        <div><label class="text-gray-400 text-xs uppercase font-bold">Type de compteur *</label>
        <select name="type_compteur" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none" required>
            {% for value, label in form.fields.type_compteur.choices %}<option value="{{ value }}" {% if form.type_compteur.value == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
        </select></div>
        <div><label class="text-gray-400 text-xs uppercase font-bold">Valeur relevée *</label>
        <input type="number" step="0.1" name="valeur" value="{{ form.valeur.value|default:'' }}" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none" required></div>
        <div><label class="text-gray-400 text-xs uppercase font-bold">Notes</label>
        <textarea name="notes" rows="2" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none"></textarea></div>
    </div>
    <div class="flex gap-3 mt-6">
        <button type="submit" class="bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-3 px-8 rounded-lg transition">💾 Enregistrer</button>
        <a href="{% url 'maintenance_machine_detail' machine.id %}" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-8 rounded-lg transition">Annuler</a>
    </div>
</form>
{% endblock %}
