{% extends 'base.html' %}
{% block content %}

<div class="mb-6 flex items-center gap-4">
    <a href="{% url 'om_list' %}" class="text-gray-400 hover:text-white transition">← Retour</a>
    <h1 class="text-2xl font-bold text-white">{{ titre }}</h1>
    {% if machine %}<span class="text-yellow-400 bg-yellow-500/10 px-3 py-1 rounded text-sm">🔧 {{ machine.name }}</span>{% endif %}
</div>

<form method="post" enctype="multipart/form-data" class="max-w-4xl">
    {% csrf_token %}
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

        <!-- IDENTIFICATION -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6">
            <h2 class="text-white font-bold mb-4 text-lg">📋 Identification</h2>
            <div class="space-y-4">
                <div>
                    <label class="text-gray-400 text-xs uppercase font-bold">Type de maintenance *</label>
                    <select name="type_maintenance" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none" required>
                        {% for value, label in form.fields.type_maintenance.choices %}
                        <option value="{{ value }}" {% if form.type_maintenance.value == value %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="text-gray-400 text-xs uppercase font-bold">Machine *</label>
                    <select name="machine" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none" required>
                        <option value="">-- Sélectionner --</option>
                        {% for m in form.fields.machine.queryset %}
                        <option value="{{ m.id }}" {% if form.machine.value|stringformat:"s" == m.id|stringformat:"s" %}selected{% endif %}>{{ m.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="text-gray-400 text-xs uppercase font-bold">Priorité *</label>
                    <select name="priorite" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none">
                        {% for value, label in form.fields.priorite.choices %}
                        <option value="{{ value }}" {% if form.priorite.value == value %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="text-gray-400 text-xs uppercase font-bold">Titre / Résumé *</label>
                    <input type="text" name="titre" value="{{ form.titre.value|default:'' }}"
                        class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none" required>
                </div>
                <div>
                    <label class="text-gray-400 text-xs uppercase font-bold">Date planifiée</label>
                    <input type="datetime-local" name="date_planifiee" value="{{ form.date_planifiee.value|default:'' }}"
                        class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none">
                </div>
            </div>
        </div>

        <!-- DESCRIPTION -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6">
            <h2 class="text-white font-bold mb-4 text-lg">📝 Description</h2>
            <div class="space-y-4">
                <div>
                    <label class="text-gray-400 text-xs uppercase font-bold">Description du problème</label>
                    <textarea name="description_probleme" rows="4"
                        class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none">{{ form.description_probleme.value|default:'' }}</textarea>
                </div>
                <div>
                    <label class="text-gray-400 text-xs uppercase font-bold">Technicien principal</label>
                    <select name="technicien_principal" class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none">
                        <option value="">-- Aucun --</option>
                        {% for emp in form.fields.technicien_principal.queryset %}
                        <option value="{{ emp.id }}" {% if form.technicien_principal.value|stringformat:"s" == emp.id|stringformat:"s" %}selected{% endif %}>{{ emp.nom_complet }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="text-gray-400 text-xs uppercase font-bold">Temps d'arrêt estimé (min)</label>
                    <input type="number" name="temps_arret_minutes" value="{{ form.temps_arret_minutes.value|default:'0' }}"
                        class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none">
                </div>
                <div>
                    <label class="text-gray-400 text-xs uppercase font-bold">Notes</label>
                    <textarea name="notes" rows="3"
                        class="w-full mt-1 bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 focus:border-yellow-500 focus:outline-none">{{ form.notes.value|default:'' }}</textarea>
                </div>
            </div>
        </div>
    </div>

    <div class="flex gap-3 mt-6">
        <button type="submit" class="bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-3 px-8 rounded-lg transition">
            💾 Enregistrer
        </button>
        <a href="{% url 'om_list' %}" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-8 rounded-lg transition">
            Annuler
        </a>
    </div>
</form>
{% endblock %}
