<div id="fb-global-search" class="hidden fixed inset-0 z-[10020]" data-api-url="{% url 'global_search_api' %}" role="dialog" aria-modal="true" aria-labelledby="fb-search-title">
  <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm" data-search-close></div>
  <div class="relative mx-auto mt-[7vh] w-[min(94vw,820px)] max-h-[86vh] overflow-hidden rounded-2xl border border-slate-600 bg-slate-950 text-slate-100 shadow-2xl">
    <div class="border-b border-slate-700 p-4">
      <div class="flex items-center gap-3"><span class="text-xl">⌕</span><input id="fb-global-search-input" type="search" autocomplete="off" spellcheck="false" maxlength="100" placeholder="Client, devis, commande, OF, matière, lot, machine…" class="min-w-0 flex-1 bg-transparent text-base md:text-lg font-bold text-white placeholder:text-slate-500 outline-none"><kbd class="hidden md:block rounded border border-slate-600 bg-slate-800 px-2 py-1 text-[10px] text-slate-400">Échap</kbd><button type="button" data-search-close class="md:hidden text-slate-400" aria-label="Fermer">✕</button></div>
    </div>
    <div id="fb-search-results" class="max-h-[68vh] overflow-y-auto p-3"><div class="p-10 text-center text-sm text-slate-400"><p class="text-3xl mb-3">⌕</p>Saisissez au moins 2 caractères.<p class="mt-2 text-xs text-slate-600">↑ ↓ pour naviguer · Entrée pour ouvrir</p></div></div>
    <div class="hidden md:flex justify-between border-t border-slate-800 px-4 py-2 text-[10px] text-slate-500"><span>Résultats limités et filtrés selon vos autorisations</span><span>Ctrl/⌘ + K</span></div>
  </div>
</div>
<script>
(function(){
 const root=document.getElementById('fb-global-search');if(!root)return;const input=document.getElementById('fb-global-search-input'),box=document.getElementById('fb-search-results');let timer=null,controller=null,active=-1;
 const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
 function open(){root.classList.remove('hidden');document.body.style.overflow='hidden';setTimeout(()=>{input.focus();input.select()},20)}
 function close(){root.classList.add('hidden');document.body.style.overflow='';active=-1}
 window.FBGlobalSearch={open,close};document.querySelectorAll('[data-global-search-open]').forEach(b=>b.addEventListener('click',open));root.querySelectorAll('[data-search-close]').forEach(b=>b.addEventListener('click',close));
 document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();open();return}if(root.classList.contains('hidden'))return;if(e.key==='Escape'){close();return}const links=[...box.querySelectorAll('[data-search-result]')];if(!links.length)return;if(e.key==='ArrowDown'){e.preventDefault();active=(active+1)%links.length} else if(e.key==='ArrowUp'){e.preventDefault();active=(active-1+links.length)%links.length}else if(e.key==='Enter'&&active>=0){e.preventDefault();links[active].click();return}else return;links.forEach((x,i)=>x.classList.toggle('ring-2',i===active));links[active].scrollIntoView({block:'nearest'})});
 function render(data){active=-1;if(!data.groups.length){box.innerHTML='<div class="p-10 text-center text-sm text-slate-400">Aucun résultat autorisé pour « '+esc(data.query)+' ».</div>';return}box.innerHTML=data.groups.map(g=>'<section class="mb-4"><h3 class="px-2 py-1 text-[11px] font-black uppercase tracking-widest text-slate-500">'+esc(g.icon)+' '+esc(g.label)+'</h3><div class="space-y-1">'+g.items.map(i=>'<a data-search-result href="'+esc(i.url)+'" class="block rounded-xl border border-transparent px-3 py-2.5 hover:border-orange-500/50 hover:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-orange-400"><div class="flex items-center justify-between gap-3"><div class="min-w-0"><p class="truncate text-sm font-black text-slate-100">'+esc(i.title)+'</p><p class="truncate text-xs text-slate-500">'+esc(i.subtitle)+'</p></div><span class="shrink-0 rounded bg-slate-800 px-2 py-1 text-[9px] font-bold uppercase text-slate-400">'+esc(i.kind)+'</span></div></a>').join('')+'</div></section>').join('')}
 async function search(){const q=input.value.trim();if(q.length<2){box.innerHTML='<div class="p-10 text-center text-sm text-slate-400">Saisissez au moins 2 caractères.</div>';return}if(controller)controller.abort();controller=new AbortController();box.innerHTML='<div class="p-10 text-center text-sm text-slate-400">Recherche…</div>';try{const r=await fetch(root.dataset.apiUrl+'?q='+encodeURIComponent(q),{headers:{'X-Requested-With':'XMLHttpRequest'},credentials:'same-origin',signal:controller.signal});if(!r.ok)throw new Error();render(await r.json())}catch(e){if(e.name!=='AbortError')box.innerHTML='<div class="p-10 text-center text-sm text-red-300">Recherche momentanément indisponible.</div>'}}
 input.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(search,220)});
})();
</script>
